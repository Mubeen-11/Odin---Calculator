<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JS Calculator</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="calculator">
			<!-- Calculator Screen Display -->
			<div id="display">0</div>

			<!-- Control Buttons -->
			<div class="buttons">
				<button id="clear" class="btn btn-control" type="button">AC</button>
				<button id="backspace" class="btn btn-control" type="button">⌫</button>
				<button class="btn btn-operator" data-operator="/" type="button">
					÷
				</button>
				<button class="btn btn-operator" data-operator="*" type="button">
					×
				</button>

				<button class="btn btn-number" type="button">7</button>
				<button class="btn btn-number" type="button">8</button>
				<button class="btn btn-number" type="button">9</button>
				<button class="btn btn-operator" data-operator="-" type="button">
					−
				</button>

				<button class="btn btn-number" type="button">4</button>
				<button class="btn btn-number" type="button">5</button>
				<button class="btn btn-number" type="button">6</button>
				<button class="btn btn-operator" data-operator="+" type="button">
					+
				</button>

				<button class="btn btn-number" type="button">1</button>
				<button class="btn btn-number" type="button">2</button>
				<button class="btn btn-number" type="button">3</button>
				<button id="equals" class="btn btn-equals" type="button">=</button>

				<button class="btn btn-number btn-zero" type="button">0</button>
				<button id="decimal" class="btn btn-number" type="button">.</button>
			</div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
